# svpb_nginx_common.conf
# Part of the nginx server block shared by production (svpb_nginx.conf) and the
# development VM (svpb_nginx.local.conf). Not a standalone configuration: it is
# included from within a server block via an absolute path, because nginx resolves
# relative include paths against /etc/nginx and not against the symlink target.

    charset     utf-8;

    # max upload size
    client_max_body_size 0M;   # adjust to taste

    # Django media
    location /media/  {
        root /home/svpb/svpb/www;  # your Django project's media files - amend as required
    }

    location /static/ {
        root /home/svpb/svpb/www; # your Django project's static files - amend as required
    }

    # Serve protected documents via sendfile (manual and mitglieder.xlsx)
    location /sendfile/ {
        internal;
        root /home/svpb/svpb/www;
    }

    # Finally, send all non-media requests to the Django server.
    # See https://docs.nginx.com/nginx/admin-guide/web-server/app-gateway-uwsgi-django/
    location / {
        # If maintenance.flag file exists, return 503 to show maintenance page
        if (-f /home/svpb/svpb/www/maintenance.flag) {
            return 503;
        }

        # Else serve Django app via uwsgi
        include /etc/nginx/uwsgi_params;
        uwsgi_pass  django;
        uwsgi_param Host $host;
        uwsgi_param X-Real-IP $remote_addr;
        uwsgi_param X-Forwarded-For $proxy_add_x_forwarded_for;
        uwsgi_param X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # Show maintenance page on error 503
    error_page 503 /maintenance.html;

    location = /maintenance.html {
        root /home/svpb/svpb/www/static;
        internal;
    }
